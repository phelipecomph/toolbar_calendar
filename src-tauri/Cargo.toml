[package]
name = "agenda-strip"
version = "0.1.0"
edition = "2021"
description = "Desktop calendar timeline strip (Windows AppBar)"
license = "MIT"
repository = "https://github.com/phelipecomph/agenda-strip"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
icalendar = "0.16"
rrule = "0.13"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
async-trait = "0.1"
tokio = { version = "1", features = ["time"] }
# OAuth (Google) + tokens seguros
keyring = { version = "3", features = ["windows-native"] }
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
url = "2"
webbrowser = "1"

# AppBar / Win32 — só no Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
